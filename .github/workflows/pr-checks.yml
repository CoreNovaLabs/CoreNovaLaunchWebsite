# pr-checks.yml — PR 质量门禁（typecheck + 数据契约 + 完整构建）
#
# 官网唯一的本地质量门是随 build 执行的 `tsc -b`；PR 上跑一次完整构建
# （fetch → tsc → vite build → SSR → prerender）能同时挡住类型错误、
# 数据契约校验回归和预渲染产物问题。CI 环境下 fetch-verified 默认走
# 公开 R2 端点（IN_CI → r2 backend），无需任何 secrets。
name: pr-checks

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - ".github/workflows/pr-checks.yml"

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GITHUB_TOKEN 抬高 GitHub API 限额，stars / release notes 不降级。
      - name: Fetch verified data + typecheck + build + prerender
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
